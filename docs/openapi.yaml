openapi: 3.0.3
info:
  title: SportMeet REST API
  version: 1.0.0-current
  description: |
    Manual API contract based on the backend source snapshot (2026-11-23).
    Login/logout are implemented by Spring Security filters. Session auth and CSRF are required.
    This specification is not auto-generated from the running application.
servers:
  - url: http://localhost:8080
    description: Local backend (port configurable)
tags:
  - name: Authentication
  - name: Users
  - name: Groups
security:
  - sessionCookie: []
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Get current CSRF token and required header name
      security: []
      responses:
        '200':
          description: CSRF token; not cacheable
          headers:
            Cache-Control:
              schema: { type: string }
              example: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfResponse' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate via Spring Security form login
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: 'Canonical login, not email' }
                password: { type: string, format: password }
      responses:
        '204': { description: Authenticated; session cookie established; no body }
        '401': { description: Invalid credentials; no response body guaranteed }
        '403': { description: Invalid or missing CSRF token }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate current session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Logged out; session invalidated and cookie cleared }
        '403': { description: Invalid or missing CSRF token }
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      summary: Get authenticated user's login
      responses:
        '200':
          description: Current login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Not authenticated }
  /api/v1/users:
    post:
      tags: [Users]
      summary: Register user (immediately ACTIVE; no email confirmation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          headers:
            Location:
              description: Resource URI; GET by ID not currently implemented
              schema: { type: string, example: /api/v1/users/42 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get own profile
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '401': { description: Not authenticated }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Change own display name or email
      description: At least one non-null field required. Unknown fields rejected. Current implementation does not verify email changes.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Not authenticated }
        '403': { description: Invalid or missing CSRF token }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users/me/history:
    get:
      tags: [Users]
      summary: Get own account modification history, newest first
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: History page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Not authenticated }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/groups:
    post:
      tags: [Groups]
      summary: Found a sports group; the signed-in user becomes its only active OWNER
      description: |
        The group and the owner membership are stored in one transaction. The owner is always taken from the
        authenticated session, never from the request body. Group names are not unique. Unknown request
        properties are ignored. Order of checks: authentication and CSRF, Bean Validation of `name`,
        active account, then business validation of lengths.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Group created
          headers:
            Location:
              description: Resource URI; GET by ID not currently implemented
              schema: { type: string, example: /api/v1/groups/1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupResponse' }
        '400': { $ref: '#/components/responses/InvalidGroupData' }
        '401': { description: Not authenticated; no response body }
        '403':
          description: |
            Missing or invalid CSRF token (body generated by Spring Security / Spring Boot, not Problem Details),
            or the signed-in user's account is no longer ACTIVE (Problem Details, title "User account not active").
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Default header name; use the actual `headerName` supplied by GET /api/v1/auth/csrf.
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request or validation error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Duplicate identity or concurrent modification
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Current user not found or inactive
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidGroupData:
      description: |
        Missing or blank name, malformed JSON, unknown visibility value (generic detail "Group data failed validation."),
        or a name or description that is too long (detail names the violated rule). Submitted values are never echoed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: about:blank
            title: Invalid group data
            status: 400
            detail: Group name must have between 1 and 100 characters.
            instance: /api/v1/groups
  schemas:
    CsrfResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName: { type: string, example: X-CSRF-TOKEN }
        token: { type: string, example: example-token }
    SessionResponse:
      type: object
      required: [login]
      properties:
        login: { type: string, example: runner }
    UserState:
      type: string
      enum: [ACTIVE, DISABLED, BLOCKED]
    CreateUserRequest:
      type: object
      required: [login, displayName, email, password]
      properties:
        login: { type: string, minLength: 2, maxLength: 80, description: 'Canonicalized: trim and lowercase' }
        displayName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, maxLength: 254, description: 'Validated and canonicalized; email format checked by application' }
        password: { type: string, format: password, minLength: 8, description: Maximum 72 UTF-8 bytes }
    UserResponse:
      type: object
      required: [id, login, displayName, email, state]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        displayName: { type: string }
        email: { type: string }
        state: { $ref: '#/components/schemas/UserState' }
    UserDetailResponse:
      allOf:
        - $ref: '#/components/schemas/UserResponse'
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time, nullable: true }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one non-null property must be provided.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, maxLength: 254 }
    HistoryEntry:
      type: object
      required: [id, attributeName, oldValue, newValue, changedBy, changedByType, changedAt]
      properties:
        id: { type: integer, format: int64 }
        attributeName:
          type: string
          enum: [DISPLAY_NAME, EMAIL, PASSWORD, STATE]
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        changedBy: { type: integer, format: int64, nullable: true }
        changedByType:
          type: string
          enum: [USER, SYSTEM]
          description: Actor type recorded in DataInfoObjectType.
        changedAt: { type: string, format: date-time }
    HistoryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    GroupVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
      description: |
        PUBLIC - the group can be found and any user may ask to join it.
        PRIVATE - the group is visible only to its members; users join by invitation.
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Trimmed; blank is rejected' }
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Trimmed; a blank description is stored as null
        visibility:
          allOf:
            - $ref: '#/components/schemas/GroupVisibility'
          nullable: true
          description: PRIVATE when omitted or null
    GroupResponse:
      type: object
      required: [id, name, description, visibility]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Normalized (trimmed) name }
        description: { type: string, nullable: true }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
