spring.application.name=SportMeet

server.port=${SERVER_PORT:8080}

# Error responses must not expose internal details or submitted values, including with DevTools.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Local PostgreSQL. Provide the password via DB_PASSWORD (never commit credentials).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sportmeet}
spring.datasource.username=${DB_USERNAME:sportmeet}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema. Hibernate only checks existing mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Basic logging; revisit when structured/centralized logging is set up.
logging.level.root=INFO
logging.level.cz.osu.sportmeet=DEBUG
