spring.application.name=SportMeet

server.port=${SERVER_PORT:8080}

# Error responses must not expose internal details or submitted values, including with DevTools.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Local PostgreSQL. Provide the password via DB_PASSWORD (never commit credentials).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sportmeet}
spring.datasource.username=${DB_USERNAME:sportmeet}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema. Hibernate only checks existing mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Shared migrations plus vendor-specific ones ({vendor} = postgresql | h2), e.g. partial indexes H2 cannot create.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

# Basic logging; revisit when structured/centralized logging is set up.
logging.level.root=INFO
logging.level.cz.osu.sportmeet=DEBUG
# Spring Session JDBC uses PostgreSQL. Flyway is the sole schema owner.
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
# Browser session: HTTPS is required for Secure cookies.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
